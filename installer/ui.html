<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELDRUN Web — Setup</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(148, 163, 184, 0.15);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #0ea5e9;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--muted);
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: "";
            width: 4px;
            height: 20px;
            border-radius: 2px;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
        }

        /* Stepper */
        .stepper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .step.pending {
            opacity: 0.6;
        }

        .step.installing {
            border-color: rgba(14, 165, 233, 0.3);
            background: rgba(14, 165, 233, 0.05);
            opacity: 1;
        }

        .step.installed {
            background: rgba(16, 185, 129, 0.05);
            opacity: 1;
        }

        .step.error {
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.3);
            opacity: 1;
        }

        .step-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .step.pending .step-icon {
            background: rgba(148, 163, 184, 0.1);
            color: var(--muted);
        }

        .step.installed .step-icon {
            background: var(--success);
            color: #fff;
        }

        .step.installing .step-icon {
            background: var(--primary);
            color: #fff;
            animation: pulse-ring 1.5s infinite;
        }

        .step.error .step-icon {
            background: var(--error);
            color: #fff;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.7);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(14, 165, 233, 0);
            }
        }

        .step-content {
            flex-grow: 1;
        }

        .step-title {
            font-size: 15px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .step-desc {
            font-size: 13px;
            color: var(--muted);
        }

        .step-status {
            font-size: 13px;
            font-weight: 500;
        }

        .step.pending .step-status {
            color: var(--muted);
        }

        .step.installed .step-status {
            color: var(--success);
        }

        .step.installing .step-status {
            color: var(--primary);
        }

        .step.error .step-status {
            color: var(--error);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Console */
        details.console-details {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #020617;
            overflow: hidden;
        }

        details.console-details summary {
            padding: 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            background: rgba(30, 41, 59, 0.5);
            outline: none;
        }

        details.console-details summary:hover {
            color: var(--text);
        }

        details.console-details[open] summary {
            border-bottom: 1px solid var(--border);
        }

        .console {
            padding: 16px;
            height: 300px;
            overflow-y: auto;
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .console::-webkit-scrollbar {
            width: 8px;
        }

        .console::-webkit-scrollbar-track {
            background: #020617;
        }

        .console::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .console-line {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .console-line.stdout {
            color: #cbd5e1;
        }

        .console-line.stderr {
            color: var(--error);
        }

        .console-line.info {
            color: var(--primary);
            font-style: italic;
        }

        .console-line.done {
            color: var(--success);
            font-weight: 700;
        }

        .console-line.error {
            color: var(--error);
            font-weight: 700;
        }

        .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">PELDRUN</div>
            <div class="tagline">Professional AI Agent — First-Time Setup</div>
        </div>

        <div class="card">
            <div class="card-title">Installation Phases</div>
            <div class="stepper" id="stepper"></div>
        </div>

        <div class="card">
            <div class="card-title">Actions</div>
            <button id="start-btn" class="btn btn-primary">Start Installation</button>
            <details class="console-details">
                <summary>Show Live Terminal Output</summary>
                <div id="console" class="console">
                    <div class="console-line info">Waiting for installation to start...</div>
                </div>
            </details>
        </div>

        <div class="footer-note">
            Estimated time: <strong>5-15 minutes</strong> · Total disk usage: <strong>~1.4 GB</strong> · Keep this tab
            open
        </div>
    </div>

    <script>
        (function () {
            const phases = [
                { id: 'config', title: 'Configuration File', desc: 'config/config.toml' },
                { id: 'python', title: 'Python 3.12+', desc: 'Python runtime' },
                { id: 'venv', title: 'Virtual Environment', desc: 'backend/.venv' },
                { id: 'backendDeps', title: 'Backend Dependencies', desc: 'Python packages' },
                { id: 'keyring', title: 'Secure Vault', desc: 'Windows Credential Manager' },
                { id: 'playwright', title: 'Playwright Chromium', desc: 'Browser automation' },
                { id: 'appImport', title: 'Application Integrity', desc: 'omweb.main verification' },
                { id: 'node', title: 'Node.js 20.9+', desc: 'Node.js runtime' },
                { id: 'frontendDeps', title: 'Frontend Dependencies', desc: 'React, Next.js, etc.' }
            ];

            phases.forEach((p, i) => { p.state = 'pending'; p.detail = 'Waiting...'; p.index = i; });

            const stepperEl = document.getElementById('stepper');
            const btn = document.getElementById('start-btn');
            const consoleEl = document.getElementById('console');

            let pollTimer = null;
            let since = 0;
            let isInstalling = false;

            function renderStepper() {
                let html = '';
                phases.forEach(p => {
                    let icon = '○';
                    if (p.state === 'installed') icon = '✓';
                    else if (p.state === 'installing') icon = '◌';
                    else if (p.state === 'error') icon = '✗';

                    let statusText = 'Pending';
                    if (p.state === 'installed') statusText = 'Installed';
                    else if (p.state === 'installing') statusText = 'Installing...';
                    else if (p.state === 'error') statusText = 'Failed';

                    html += `
        <div class="step ${p.state}">
          <div class="step-icon">${icon}</div>
          <div class="step-content">
            <div class="step-title">${p.title}</div>
            <div class="step-desc">${p.detail}</div>
          </div>
          <div class="step-status">${statusText}</div>
        </div>
      `;
                });
                stepperEl.innerHTML = html;
            }

            function stripAnsi(str) {
                return str.replace(/\x1B\[[0-9;]*[a-zA-Z]/g, '');
            }

            function appendConsole(type, text) {
                const div = document.createElement('div');
                div.className = 'console-line ' + type;
                div.textContent = text;
                consoleEl.appendChild(div);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }

            async function checkState() {
                try {
                    const res = await fetch('/api/check');
                    const data = await res.json();

                    phases[0].detail = data.config ? 'Found' : 'Missing';
                    if (data.config) phases[0].state = 'installed';

                    phases[1].detail = data.pythonVersion ? `Version ${data.pythonVersion}` : 'Not found';
                    if (data.python) phases[1].state = 'installed';

                    phases[2].detail = data.venv ? 'Exists' : 'Not found';
                    if (data.venv) phases[2].state = 'installed';

                    phases[3].detail = data.backendDeps ? 'Installed' : 'Missing';
                    if (data.backendDeps) phases[3].state = 'installed';

                    phases[4].detail = data.keyring ? 'Configured' : 'Not configured';
                    if (data.keyring) phases[4].state = 'installed';

                    phases[5].detail = data.playwright ? 'Downloaded' : 'Missing';
                    if (data.playwright) phases[5].state = 'installed';

                    phases[6].detail = data.appImport ? 'Verified' : 'Pending';
                    if (data.appImport) phases[6].state = 'installed';

                    phases[7].detail = data.nodeVersion ? `Version ${data.nodeVersion}` : 'Not found';
                    if (data.node) phases[7].state = 'installed';

                    phases[8].detail = data.frontendDeps ? 'Installed' : 'Missing';
                    if (data.frontendDeps) phases[8].state = 'installed';

                    renderStepper();
                } catch (err) {
                    console.error('check failed', err);
                }
            }

            function processLine(type, data) {
                data = stripAnsi(data);
                appendConsole(type, data);

                const match = data.match(/^>>> \[(\d+)\/(?:7|9)\] (.*)/);
                if (match) {
                    const stepIdx = parseInt(match[1]) - 1;
                    const rawDesc = match[2];

                    for (let i = 0; i < stepIdx; i++) {
                        if (phases[i].state === 'installing' || phases[i].state === 'pending') {
                            phases[i].state = 'installed';
                            if (phases[i].detail === 'Waiting...') phases[i].detail = 'Installed';
                        }
                    }

                    if (stepIdx >= 0 && stepIdx < phases.length) {
                        phases[stepIdx].state = 'installing';
                        phases[stepIdx].detail = rawDesc.replace(/\.\.\.$/, '');
                        renderStepper();
                    }
                } else if (data.includes('[FATAL]')) {
                    const current = phases.find(p => p.state === 'installing');
                    if (current) {
                        current.state = 'error';
                        current.detail = data.trim();
                        renderStepper();
                    }
                }
            }

            async function pollOutput() {
                if (!isInstalling) return;

                try {
                    const res = await fetch('/api/output?since=' + since);
                    if (!res.ok) return;

                    const data = await res.json();

                    if (data.lines && data.lines.length > 0) {
                        data.lines.forEach(line => processLine(line.type || 'stdout', line.data || ''));
                    }

                    since = data.nextPos || 0;

                    if (data.done) {
                        stopPolling();
                        phases.forEach(p => {
                            if (p.state !== 'error') p.state = 'installed';
                        });
                        renderStepper();

                        if (data.exitCode === 0 || data.exitCode === null) {
                            appendConsole('done', '✓ Installation completed successfully.');
                            btn.textContent = 'Installation Complete';
                            btn.disabled = true;
                        } else {
                            appendConsole('error', '✗ Installation exited with code ' + data.exitCode + '.');
                            btn.textContent = 'Retry Installation';
                            btn.disabled = false;
                            isInstalling = false;
                        }
                    }
                } catch (err) {
                    // Ignore transient network errors — polling continues
                }
            }

            function startPolling() {
                if (pollTimer) return;
                pollTimer = setInterval(pollOutput, 400);
            }

            function stopPolling() {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            }

            async function startInstall() {
                if (isInstalling) return;

                isInstalling = true;
                since = 0;
                btn.disabled = true;
                btn.textContent = 'Installing...';

                phases.forEach(p => {
                    if (p.state !== 'installed') {
                        p.state = 'pending';
                        p.detail = 'Waiting...';
                    }
                });
                renderStepper();

                try {
                    const res = await fetch('/api/install', { method: 'POST' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                } catch (err) {
                    appendConsole('error', 'Could not start installation: ' + err.message);
                    btn.disabled = false;
                    btn.textContent = 'Retry Installation';
                    isInstalling = false;
                    return;
                }

                startPolling();
            }

            btn.addEventListener('click', startInstall);
            renderStepper();
            checkState();
        })();
    </script>
</body>

</html>
